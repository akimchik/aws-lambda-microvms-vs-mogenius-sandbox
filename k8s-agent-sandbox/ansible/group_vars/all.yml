---
# Cluster Sizing & Runtime Configuration
minikube_cpus: 4
minikube_memory_mb: 8192
effective_cpus: 4
effective_memory_mb: 8192
minikube_custom_memory_mb: ""
minikube_ci_mode: false
minikube_driver: docker
minikube_container_runtime: containerd
minikube_worker_node: minikube-m02
minikube_ip: "127.0.0.1"

# Mogenius Sandbox Scaling & Version Controls (Scaled-Up & Scaled-Out Modes)
sandbox_warmpool_replicas: 1
sandbox_cpu_request: "250m"
sandbox_cpu_limit: "2"
sandbox_memory_request: "512Mi"
sandbox_memory_limit: "2Gi"
sandbox_code_version: "v1.2.1"

# Execution Modes
force_helm_upgrade: false
dry_run_mode: false
preflight_only_mode: false

# Optional Linux VM Headless & Kernel Optimizations
configure_linux_sysctl: true
headless_vm_optimize: false

# Cross-OS Preflight, Routing, Firewall, Swap & SELinux Controls
k8s_min_python_version: "3.9"
k8s_min_ram_mb: 2048
k8s_min_cpus: 2
k8s_min_linux_kernel_cgroupv2: "5.2"
k8s_min_linux_kernel_nftables: "5.13"
k8s_rp_filter_mode: "2"
k8s_firewall_mode: "audit"       # audit | configure | disable
k8s_disable_swap: false          # false = safe default on dev workstations; true = disable swap + zram
k8s_selinux_state: "permissive"  # permissive | enforcing (RedHat-family only)
k8s_configure_network_daemons: "{{ configure_linux_sysctl | bool }}"
k8s_cni_unmanaged_interfaces: "interface-name:cali*;interface-name:flannel*;interface-name:cni*;interface-name:veth*;interface-name:br-*;interface-name:docker*"
k8s_pause_image: "registry.k8s.io/pause:3.10"

# Chart & Tool Versions (configured to "latest" to pull newest stable releases)
mogenius_chart_version: "latest"
testkube_chart_version: "latest"
testkube_cli_version: "latest"
kubectl_version: "latest"
k8s_fallback_version: "v1.31.0"

# Open File & Descriptor Limits Controls (for high-concurrency Linux port-forwarding & ingress)
nofile_controls:
  linux:
    fs_file_max: 2097152
    fs_nr_open: 2097152
    nofile_soft: 1048576
    nofile_hard: 1048576
    systemd_limit_nofile: 1048576

# Kernel sysctl parameters for multi-node Kubernetes + Prometheus + gVisor
k8s_sysctl_params:
  fs.inotify.max_user_watches: 1048576
  fs.inotify.max_user_instances: 8192
  vm.max_map_count: 262144
  net.ipv4.ip_forward: 1
  fs.file-max: 2097152
  fs.nr_open: 2097152

# 11 Core Service Endpoints to verify at the end of reconciliation
core_service_endpoints:
  - { ns: "ingress-nginx", svc: "ingress-nginx-controller" }
  - { ns: "agent-sandbox-system", svc: "agent-sandbox-controller" }
  - { ns: "agent-sandbox-system", svc: "sandbox-router" }
  - { ns: "agent-sandbox-system", svc: "sandbox-latency-exporter" }
  - { ns: "sandbox-egress-system", svc: "egress-broker" }
  - { ns: "monitoring", svc: "monitoring-grafana" }
  - { ns: "monitoring", svc: "monitoring-kube-prometheus-prometheus" }
  - { ns: "testkube", svc: "testkube-api-server" }
  - { ns: "testkube", svc: "testkube-mongodb" }
  - { ns: "testkube", svc: "testkube-nats" }
  - { ns: "testkube", svc: "testkube-minio-service-testkube" }
