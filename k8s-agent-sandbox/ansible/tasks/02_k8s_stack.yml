---
- name: "[4/8] Reconcile NGINX Ingress Controller addon"
  ansible.builtin.shell: |
    set -euo pipefail
    if ! kubectl -n ingress-nginx get deployment ingress-nginx-controller >/dev/null 2>&1; then
      minikube addons disable ingress >/dev/null 2>&1 || true
      minikube addons enable ingress
    fi
    for i in $(seq 1 30); do
      kubectl -n ingress-nginx get deployment ingress-nginx-controller >/dev/null 2>&1 && break
      sleep 2
    done
    kubectl -n ingress-nginx rollout status deployment/ingress-nginx-controller --timeout=180s
  args:
    executable: /bin/bash
  when: not (dry_run_mode | bool)
  tags: [ingress, k8s-stack]

- name: "[5/8] Reconcile Observability Stack (kube-prometheus-stack & 3 Grafana Dashboards)"
  ansible.builtin.shell: |
    set -euo pipefail
    K8S_DIR="{{ playbook_dir }}/../.."
    STATUS=$(helm status monitoring -n monitoring 2>/dev/null | awk '/^STATUS:/{print $2}' || echo "")
    if [ "$STATUS" != "deployed" ] || \
       ! kubectl -n monitoring get deployment monitoring-grafana >/dev/null 2>&1 || \
       [ "{{ force_helm_upgrade | bool | lower }}" = "true" ]; then
      helm repo add prometheus-community https://prometheus-community.github.io/helm-charts >/dev/null 2>&1 || true
      helm repo update prometheus-community >/dev/null
      helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
        -n monitoring --create-namespace \
        -f "${K8S_DIR}/monitoring/values-prometheus-grafana.yaml" \
        --wait --timeout=5m
    fi
    kubectl apply -f "${K8S_DIR}/monitoring/monitoring-ingress.yaml" \
                  -f "${K8S_DIR}/monitoring/grafana-dashboard-agent-sandbox.yaml" \
                  -f "${K8S_DIR}/monitoring/grafana-dashboard-sandbox-http-responses.yaml" \
                  -f "${K8S_DIR}/monitoring/grafana-dashboard-testkube.yaml" >/dev/null
  args:
    executable: /bin/bash
  when: not (dry_run_mode | bool)
  tags: [monitoring, k8s-stack]

- name: "[6/8] Reconcile mogenius Agent Sandbox, Warm Pool, Router & Latency Exporter"
  ansible.builtin.shell: |
    set -euo pipefail
    K8S_DIR="{{ playbook_dir }}/../.."
    STATUS=$(helm status agent-sandbox -n agent-sandbox-system 2>/dev/null | awk '/^STATUS:/{print $2}' || echo "")
    if [ "$STATUS" != "deployed" ] || \
       ! kubectl -n agent-sandbox get sandboxwarmpool default >/dev/null 2>&1 || \
       [ "{{ force_helm_upgrade | bool | lower }}" = "true" ]; then
      helm repo add mogenius https://helm.mogenius.com/public >/dev/null 2>&1 || true
      helm repo update mogenius >/dev/null
      CHART_VER="{{ mogenius_chart_version | default('latest') }}"
      EXTRA_HELM_ARG=""
      [ "$CHART_VER" != "latest" ] && [ -n "$CHART_VER" ] && EXTRA_HELM_ARG="--version $CHART_VER"
      helm upgrade --install agent-sandbox mogenius/mogenius-agent-sandbox \
        ${EXTRA_HELM_ARG} \
        -n agent-sandbox-system --create-namespace \
        -f "${K8S_DIR}/helm/values-mogenius.yaml" \
        --set "sandboxes.profiles.default.warmPool.replicas={{ sandbox_warmpool_replicas | default(1) }}" \
        --set "sandboxes.profiles.default.resources.requests.cpu={{ sandbox_cpu_request | default('250m') }}" \
        --set "sandboxes.profiles.default.resources.limits.cpu={{ sandbox_cpu_limit | default('2') }}" \
        --set "sandboxes.profiles.default.resources.requests.memory={{ sandbox_memory_request | default('512Mi') }}" \
        --set "sandboxes.profiles.default.resources.limits.memory={{ sandbox_memory_limit | default('2Gi') }}" \
        --wait --timeout=3m
    fi
    kubectl apply -f "${K8S_DIR}/ingress/sandbox-router.yaml" \
                  -f "${K8S_DIR}/ingress/sandbox-ingress.yaml" \
                  -f "${K8S_DIR}/monitoring/agent-sandbox-servicemonitor.yaml" \
                  -f "${K8S_DIR}/monitoring/sandbox-latency-exporter.yaml" >/dev/null
    EXP_HASH=$(openssl dgst -sha256 "${K8S_DIR}/monitoring/sandbox-latency-exporter.yaml" 2>/dev/null | awk '{print $NF}' || echo "v1")
    kubectl -n agent-sandbox-system patch deployment sandbox-latency-exporter \
      -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"checksum/config\":\"${EXP_HASH}\"}}}}}" >/dev/null 2>&1 || true
    kubectl -n agent-sandbox-system rollout status deployment/sandbox-router --timeout=180s
    kubectl -n agent-sandbox-system rollout status deployment/sandbox-latency-exporter --timeout=180s
  args:
    executable: /bin/bash
  when: not (dry_run_mode | bool)
  tags: [agent-sandbox, k8s-stack]

- name: "[7/8] Reconcile Zero-Trust Out-of-Sandbox Egress & Credential Broker"
  ansible.builtin.shell: |
    set -euo pipefail
    K8S_DIR="{{ playbook_dir }}/../.."
    kubectl apply -f "${K8S_DIR}/threat-model/egress-broker.yaml" >/dev/null
    BROKER_HASH=$(openssl dgst -sha256 "${K8S_DIR}/threat-model/egress-broker.yaml" 2>/dev/null | awk '{print $NF}' || echo "v1")
    kubectl -n sandbox-egress-system patch deployment egress-broker \
      -p "{\"spec\":{\"template\":{\"metadata\":{\"annotations\":{\"checksum/config\":\"${BROKER_HASH}\"}}}}}" >/dev/null 2>&1 || true
    kubectl -n sandbox-egress-system rollout status deployment/egress-broker --timeout=180s
  args:
    executable: /bin/bash
  when: not (dry_run_mode | bool)
  tags: [egress-broker, k8s-stack]

- name: "[8/8] Render Testkube workflow templates with dynamic Minikube IP"
  ansible.builtin.template:
    src: "{{ playbook_dir }}/../../testkube/templates/{{ item }}.j2"
    dest: "{{ playbook_dir }}/../../testkube/{{ item }}"
    mode: "0644"
  loop:
    - test-workflow.yaml
    - test-workflow-security.yaml
    - test-workflow-sustained-load.yaml
  when: not (dry_run_mode | bool)
  tags: [testkube, k8s-stack]

- name: "[8/8] Reconcile Testkube OSS on '{{ minikube_worker_node }}', RBAC & TestWorkflows"
  ansible.builtin.shell: |
    set -euo pipefail
    K8S_DIR="{{ playbook_dir }}/../.."
    STATUS=$(helm status testkube -n testkube 2>/dev/null | awk '/^STATUS:/{print $2}' || echo "")
    API_READY=$(kubectl -n testkube get deployment testkube-api-server -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
    MONGO_READY=$(kubectl -n testkube get deployment testkube-mongodb -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
    if [ "$STATUS" != "deployed" ] || [ "${API_READY:-0}" -lt 1 ] || [ "${MONGO_READY:-0}" -lt 1 ] || \
       [ "{{ force_helm_upgrade | bool | lower }}" = "true" ]; then
      helm repo add kubeshop https://kubeshop.github.io/helm-charts >/dev/null 2>&1 || true
      helm repo update kubeshop >/dev/null
      TK_CHART_VER="{{ testkube_chart_version | default('latest') }}"
      TK_EXTRA_ARG=""
      [ "$TK_CHART_VER" != "latest" ] && [ -n "$TK_CHART_VER" ] && TK_EXTRA_ARG="--version $TK_CHART_VER"
      helm upgrade --install testkube kubeshop/testkube \
        ${TK_EXTRA_ARG} \
        -n testkube --create-namespace \
        -f "${K8S_DIR}/testkube/values-testkube.yaml" \
        --wait --timeout=5m
    fi
    kubectl apply -f "${K8S_DIR}/testkube/rbac.yaml" >/dev/null
    while IFS= read -r wf; do
      [ -n "$wf" ] && kubectl apply -f "$wf" >/dev/null
    done < <(find "${K8S_DIR}/testkube" -maxdepth 1 -name "test-workflow*.yaml" | sort)
    kubectl -n testkube rollout status deployment/testkube-mongodb --timeout=180s
    kubectl -n testkube rollout status deployment/testkube-api-server --timeout=180s
  args:
    executable: /bin/bash
  when: not (dry_run_mode | bool)
  tags: [testkube, k8s-stack]

- name: "[Verify] Test live gVisor RuntimeClass sandbox creation"
  ansible.builtin.shell: |
    set -euo pipefail
    kubectl -n default delete pod gvisor-verification-probe --ignore-not-found=true >/dev/null
    cat <<EOF | kubectl apply -f - >/dev/null
    apiVersion: v1
    kind: Pod
    metadata:
      name: gvisor-verification-probe
      namespace: default
    spec:
      runtimeClassName: gvisor
      restartPolicy: Never
      containers:
        - name: probe
          image: registry.k8s.io/pause:3.9
    EOF
    if ! kubectl -n default wait --for=condition=Ready pod/gvisor-verification-probe --timeout=60s >/dev/null; then
      echo "=== gVisor Verification Probe Failed! ===" >&2
      kubectl -n default describe pod gvisor-verification-probe >&2
      exit 1
    fi
    kubectl -n default delete pod gvisor-verification-probe --ignore-not-found=true >/dev/null
  args:
    executable: /bin/bash
  changed_when: false
  when: not (dry_run_mode | bool)
  tags: [verify]

- name: "[Verify] Assert mogenius SandboxWarmPool pods are running and ready"
  ansible.builtin.shell: |
    set -euo pipefail
    SELECTOR=$(kubectl -n agent-sandbox get sandboxwarmpool default -o jsonpath='{.status.selector}' 2>/dev/null || echo "")
    FILTER_ARG=""
    [ -n "$SELECTOR" ] && FILTER_ARG="-l $SELECTOR"

    # Wait up to 60s for warm pool standby pod(s) to be created
    for i in $(seq 1 30); do
      PODS=$(kubectl -n agent-sandbox get pods ${FILTER_ARG} -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || echo "")
      if [ -n "$PODS" ]; then
        break
      fi
      if [ -z "$SELECTOR" ]; then
        SELECTOR=$(kubectl -n agent-sandbox get sandboxwarmpool default -o jsonpath='{.status.selector}' 2>/dev/null || echo "")
        [ -n "$SELECTOR" ] && FILTER_ARG="-l $SELECTOR"
      fi
      sleep 2
    done

    PODS=$(kubectl -n agent-sandbox get pods ${FILTER_ARG} -o jsonpath='{.items[*].metadata.name}' 2>/dev/null || echo "")
    if [ -z "$PODS" ]; then
      echo "=== Error: No SandboxWarmPool pods found in agent-sandbox ===" >&2
      kubectl -n agent-sandbox get sandboxwarmpools,pods -o wide >&2
      exit 1
    fi

    # Wait for the warm pool pod(s) to reach Ready condition
    WAIT_TARGET="pod ${FILTER_ARG}"
    [ -z "$FILTER_ARG" ] && WAIT_TARGET="pod --all"
    if ! kubectl -n agent-sandbox wait --for=condition=Ready ${WAIT_TARGET} --timeout=90s >/dev/null; then
      echo "=== Warm Pool Pod Failed to Reach Ready ===" >&2
      kubectl -n agent-sandbox get pods ${FILTER_ARG} -o wide >&2
      kubectl -n agent-sandbox describe pods ${FILTER_ARG} >&2
      exit 1
    fi
  args:
    executable: /bin/bash
  changed_when: false
  when: not (dry_run_mode | bool)
  tags: [verify]

- name: "[Verify] Assert all 11 core service endpoints have active backends"
  ansible.builtin.shell: |
    set -euo pipefail
    {% for item in core_service_endpoints %}
    IPS=$(kubectl -n "{{ item.ns }}" get endpointslices -l "kubernetes.io/service-name={{ item.svc }}" -o jsonpath="{.items[*].endpoints[?(@.conditions.ready==true)].addresses[*]}" 2>/dev/null || echo "")
    [ -n "$IPS" ] || IPS=$(kubectl -n "{{ item.ns }}" get endpoints "{{ item.svc }}" -o jsonpath="{.subsets[*].addresses[*].ip}" 2>/dev/null || echo "")
    if [ -z "$IPS" ]; then
      echo "ERROR: [{{ item.ns }}] {{ item.svc }} has no ready endpoints!" >&2
      exit 1
    fi
    echo "OK: [{{ item.ns }}] {{ item.svc }} -> ($IPS)"
    {% endfor %}
    kubectl wait --for=condition=Ready node/minikube node/{{ minikube_worker_node }} --timeout=60s >/dev/null
  args:
    executable: /bin/bash
  register: endpoint_verification
  changed_when: false
  when: not (dry_run_mode | bool)
  tags: [verify]
