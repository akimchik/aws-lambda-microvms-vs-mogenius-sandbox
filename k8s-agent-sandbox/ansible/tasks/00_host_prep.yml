---
- name: "[0/8] Map normalized CPU architecture facts (cli_arch and runsc_arch)"
  ansible.builtin.set_fact:
    cli_arch: "{{ 'amd64' if ansible_facts['architecture'] in ['x86_64', 'amd64'] else 'arm64' }}"
    runsc_arch: "{{ 'x86_64' if ansible_facts['architecture'] in ['x86_64', 'amd64'] else 'aarch64' }}"
    host_pkg_mgr: >-
      {{
        'brew' if ansible_facts['system'] == 'Darwin'
        else ('apt' if ansible_facts['pkg_mgr'] == 'apt'
        else ('dnf' if ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
        else ('yum' if ansible_facts['pkg_mgr'] == 'yum' else 'generic')))
      }}
  tags: [always, preflight, host-prep]

- name: "[0/8] Display detected host platform, architecture, and package manager"
  ansible.builtin.debug:
    msg: "Host={{ ansible_facts['system'] }} ({{ ansible_facts['os_family'] }}) | Arch={{ ansible_facts['architecture'] }} (CLI={{ cli_arch }}, gVisor={{ runsc_arch }}) | PkgMgr={{ host_pkg_mgr }}"
  tags: [always, preflight, host-prep]

- name: "[0/8] Check if base utilities are installed (curl, tar, jq, bzip2)"
  ansible.builtin.shell: |
    for tool in curl tar jq bzip2; do
      if ! command -v "$tool" >/dev/null 2>&1; then
        echo "MISSING:$tool"
      fi
    done
  args:
    executable: /bin/bash
  register: base_utils_check
  changed_when: false
  check_mode: false
  tags: [always, preflight, host-prep]

- name: "[0/8] Install Linux base utilities via apt (Debian/Ubuntu)"
  ansible.builtin.apt:
    name: [curl, ca-certificates, tar, jq, bzip2]
    state: present
    update_cache: true
  become: "{{ ansible_facts['user_id'] != 'root' }}"
  when:
    - ansible_facts['system'] == 'Linux'
    - ansible_facts['os_family'] == 'Debian'
    - "'MISSING:' in base_utils_check.stdout"
    - not (dry_run_mode | bool)
  tags: [preflight, host-prep]

- name: "[0/8] Install Linux base utilities via dnf/yum (RHEL/Rocky/Alma/Fedora)"
  ansible.builtin.shell: |
    if command -v dnf >/dev/null 2>&1; then
      dnf install -y --allowerasing curl ca-certificates tar jq bzip2
    else
      yum install -y curl ca-certificates tar jq bzip2
    fi
  args:
    executable: /bin/bash
  become: "{{ ansible_facts['user_id'] != 'root' }}"
  changed_when: false
  when:
    - ansible_facts['system'] == 'Linux'
    - ansible_facts['os_family'] == 'RedHat'
    - "'MISSING:' in base_utils_check.stdout"
    - not (dry_run_mode | bool)
  tags: [preflight, host-prep]

- name: "[0/8] Audit live Linux open file limits and kernel sysctl"
  ansible.builtin.shell: |
    FILE_MAX=$(sysctl -n fs.file-max 2>/dev/null || echo "0")
    NR_OPEN=$(sysctl -n fs.nr_open 2>/dev/null || echo "0")
    REQ_FILE_MAX={{ nofile_controls.linux.fs_file_max }}
    REQ_NR_OPEN={{ nofile_controls.linux.fs_nr_open }}
    ADJUST="false"
    if [ "$FILE_MAX" -lt "$REQ_FILE_MAX" ] || [ "$NR_OPEN" -lt "$REQ_NR_OPEN" ]; then
      ADJUST="true"
    fi
    VM_MAX=$(sysctl -n vm.max_map_count 2>/dev/null || echo "0")
    INOTIFY_WATCH=$(sysctl -n fs.inotify.max_user_watches 2>/dev/null || echo "0")
    if [ "$VM_MAX" -lt 262144 ] || [ "$INOTIFY_WATCH" -lt 524288 ]; then
      ADJUST="true"
    fi
    echo "FILE_MAX=$FILE_MAX"
    echo "NR_OPEN=$NR_OPEN"
    echo "NEEDS_ADJUSTMENT=$ADJUST"
  args:
    executable: /bin/bash
  register: linux_nofile_audit
  changed_when: false
  check_mode: false
  when:
    - ansible_facts['system'] == 'Linux'
    - configure_linux_sysctl | bool
  tags: [always, host-prep, sysctl, nofile]

- name: "[0/8] Display Linux open file limit status"
  ansible.builtin.debug:
    msg: "Linux File Limits Audit: {{ linux_nofile_audit.stdout_lines | default([]) }}"
  when:
    - ansible_facts['system'] == 'Linux'
    - configure_linux_sysctl | bool
  tags: [always, host-prep, sysctl, nofile]

- name: "[0/8] Ensure systemd and security limits directories exist on Linux"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/sysctl.d
    - /etc/security/limits.d
    - /etc/systemd/system.conf.d
    - /etc/systemd/user.conf.d
  become: "{{ ansible_facts['user_id'] != 'root' }}"
  ignore_errors: true
  ignore_unreachable: true
  failed_when: false
  when:
    - ansible_facts['system'] == 'Linux'
    - configure_linux_sysctl | bool
    - "'NEEDS_ADJUSTMENT=true' in (linux_nofile_audit.stdout | default(''))"
    - not (dry_run_mode | bool)
  tags: [host-prep, sysctl, nofile]

- name: "[0/8] Persist Linux kernel sysctl parameters (/etc/sysctl.d/99-kubernetes-sandbox.conf)"
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-sandbox.conf
    mode: "0644"
    content: |
      fs.inotify.max_user_watches={{ k8s_sysctl_params['fs.inotify.max_user_watches'] }}
      fs.inotify.max_user_instances={{ k8s_sysctl_params['fs.inotify.max_user_instances'] }}
      vm.max_map_count={{ k8s_sysctl_params['vm.max_map_count'] }}
      net.ipv4.ip_forward={{ k8s_sysctl_params['net.ipv4.ip_forward'] }}
      fs.file-max={{ nofile_controls.linux.fs_file_max }}
      fs.nr_open={{ nofile_controls.linux.fs_nr_open }}
  become: "{{ ansible_facts['user_id'] != 'root' }}"
  ignore_errors: true
  ignore_unreachable: true
  failed_when: false
  when:
    - ansible_facts['system'] == 'Linux'
    - configure_linux_sysctl | bool
    - "'NEEDS_ADJUSTMENT=true' in (linux_nofile_audit.stdout | default(''))"
    - not (dry_run_mode | bool)
  tags: [host-prep, sysctl, nofile]

- name: "[0/8] Apply Linux open file descriptor limits in PAM (/etc/security/limits.d/99-kubernetes-sandbox-nofile.conf)"
  ansible.builtin.copy:
    dest: /etc/security/limits.d/99-kubernetes-sandbox-nofile.conf
    mode: "0644"
    content: |
      # Open file limits for Kubernetes agent sandbox and ingress port-forwarding
      * soft nofile {{ nofile_controls.linux.nofile_soft }}
      * hard nofile {{ nofile_controls.linux.nofile_hard }}
      root soft nofile {{ nofile_controls.linux.nofile_soft }}
      root hard nofile {{ nofile_controls.linux.nofile_hard }}
  become: "{{ ansible_facts['user_id'] != 'root' }}"
  ignore_errors: true
  ignore_unreachable: true
  failed_when: false
  when:
    - ansible_facts['system'] == 'Linux'
    - configure_linux_sysctl | bool
    - "'NEEDS_ADJUSTMENT=true' in (linux_nofile_audit.stdout | default(''))"
    - not (dry_run_mode | bool)
  tags: [host-prep, sysctl, nofile]

- name: "[0/8] Apply systemd Manager DefaultLimitNOFILE to fix 'Failed to allocate manager object: Too many open files'"
  ansible.builtin.copy:
    dest: "{{ item }}"
    mode: "0644"
    content: |
      [Manager]
      DefaultLimitNOFILE={{ nofile_controls.linux.systemd_limit_nofile }}
  loop:
    - /etc/systemd/system.conf.d/99-nofile.conf
    - /etc/systemd/user.conf.d/99-nofile.conf
  become: "{{ ansible_facts['user_id'] != 'root' }}"
  ignore_errors: true
  ignore_unreachable: true
  failed_when: false
  when:
    - ansible_facts['system'] == 'Linux'
    - configure_linux_sysctl | bool
    - "'NEEDS_ADJUSTMENT=true' in (linux_nofile_audit.stdout | default(''))"
    - not (dry_run_mode | bool)
  tags: [host-prep, sysctl, nofile]

- name: "[0/8] Reload Linux kernel sysctl and re-exec systemd daemon"
  ansible.builtin.shell: |
    sysctl -p /etc/sysctl.d/99-kubernetes-sandbox.conf >/dev/null 2>&1 || true
    systemctl daemon-reexec >/dev/null 2>&1 || true
  args:
    executable: /bin/bash
  become: "{{ ansible_facts['user_id'] != 'root' }}"
  ignore_errors: true
  ignore_unreachable: true
  failed_when: false
  changed_when: true
  when:
    - ansible_facts['system'] == 'Linux'
    - configure_linux_sysctl | bool
    - "'NEEDS_ADJUSTMENT=true' in (linux_nofile_audit.stdout | default(''))"
    - not (dry_run_mode | bool)
  tags: [host-prep, sysctl, nofile]


- name: "[0/8] Mask systemd wait-online services when headless_vm_optimize=true"
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
  loop:
    - NetworkManager-wait-online.service
    - systemd-networkd-wait-online.service
  become: "{{ ansible_facts['user_id'] != 'root' }}"
  ignore_errors: true
  ignore_unreachable: true
  failed_when: false
  when:
    - ansible_facts['system'] == 'Linux'
    - headless_vm_optimize | bool
    - not (dry_run_mode | bool)
  tags: [host-prep, vm-optimize]

- name: "[0/8] Audit host CLI tools (kubectl, minikube, helm, testkube, docker)"
  ansible.builtin.shell: |
    for tool in kubectl minikube helm testkube docker; do
      if command -v "$tool" >/dev/null 2>&1; then
        echo "PRESENT:$tool:$(command -v "$tool")"
      else
        echo "MISSING:$tool"
      fi
    done
  args:
    executable: /bin/bash
  register: cli_audit
  changed_when: false
  check_mode: false
  tags: [always, preflight, host-prep]

- name: "[0/8] Install missing CLI tools on macOS via Homebrew"
  ansible.builtin.shell: |
    set -e
    command -v kubectl >/dev/null 2>&1 || brew install kubectl
    command -v minikube >/dev/null 2>&1 || brew install minikube
    command -v helm >/dev/null 2>&1 || brew install helm
    command -v testkube >/dev/null 2>&1 || brew install kubeshop/testkube/testkube || brew install testkube
  args:
    executable: /bin/bash
  changed_when: true
  when:
    - ansible_facts['system'] == 'Darwin'
    - "'MISSING:kubectl' in cli_audit.stdout or 'MISSING:minikube' in cli_audit.stdout or 'MISSING:helm' in cli_audit.stdout or 'MISSING:testkube' in cli_audit.stdout"
    - not (dry_run_mode | bool)
  tags: [preflight, host-prep]

- name: "[0/8] Install multi-arch kubectl on Linux if missing"
  ansible.builtin.shell: |
    set -e
    K8S_VER="{{ kubectl_version | default('latest') }}"
    if [ "$K8S_VER" = "latest" ]; then
      K8S_VER=$(curl -L -s https://dl.k8s.io/release/stable.txt 2>/dev/null || echo "{{ k8s_fallback_version }}")
    fi
    curl -fsSL "https://dl.k8s.io/release/${K8S_VER}/bin/linux/{{ cli_arch }}/kubectl" -o /usr/local/bin/kubectl
    chmod 0755 /usr/local/bin/kubectl
  args:
    executable: /bin/bash
  become: "{{ ansible_facts['user_id'] != 'root' }}"
  changed_when: true
  when:
    - ansible_facts['system'] == 'Linux'
    - "'MISSING:kubectl' in cli_audit.stdout"
    - not (dry_run_mode | bool)
  tags: [preflight, host-prep]

- name: "[0/8] Check installed Minikube version"
  ansible.builtin.shell: |
    minikube version --short 2>/dev/null || minikube version 2>/dev/null | grep -oE 'v[0-9]+\.[0-9]+' | head -n1 || echo "v0.0"
  args:
    executable: /bin/bash
  register: mk_ver_out
  changed_when: false
  check_mode: false
  tags: [always, preflight, host-prep]

- name: "[0/8] Install or upgrade multi-arch Minikube (>= v1.30) on Linux"
  ansible.builtin.get_url:
    url: "https://storage.googleapis.com/minikube/releases/latest/minikube-linux-{{ cli_arch }}"
    dest: /usr/local/bin/minikube
    mode: "0755"
    force: true
  become: "{{ ansible_facts['user_id'] != 'root' }}"
  when:
    - ansible_facts['system'] == 'Linux'
    - "'MISSING:minikube' in cli_audit.stdout or ((mk_ver_out.stdout | trim | regex_replace('^v', '')) is version('1.30', '<'))"
    - not (dry_run_mode | bool)
  tags: [preflight, host-prep]

- name: "[0/8] Install Helm v3 and Testkube CLI on Linux if missing"
  ansible.builtin.shell: |
    set -e
    command -v helm >/dev/null 2>&1 || (curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash)
    if ! command -v testkube >/dev/null 2>&1; then
      TK_VER="{{ testkube_cli_version | default('latest') }}"
      if [ "$TK_VER" = "latest" ]; then
        # Resolve latest tag via HTTP redirect header to bypass anonymous GitHub API rate limits
        TK_VER=$(curl -fsSLI -o /dev/null -w '%{url_effective}' https://github.com/kubeshop/testkube/releases/latest 2>/dev/null | awk -F/ '{print $NF}' | tr -d 'v' || echo "")
      fi
      if [ -n "$TK_VER" ]; then
        export TESTKUBE_VERSION="$TK_VER"
      fi
      curl -sSLf https://get.testkube.io | bash
    fi
  args:
    executable: /bin/bash
  become: "{{ ansible_facts['user_id'] != 'root' }}"
  changed_when: true
  when:
    - ansible_facts['system'] == 'Linux'
    - "'MISSING:helm' in cli_audit.stdout or 'MISSING:testkube' in cli_audit.stdout"
    - not (dry_run_mode | bool)
  tags: [preflight, host-prep]
