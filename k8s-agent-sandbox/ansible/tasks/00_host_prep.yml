---
- name: "[0/8] Map normalized CPU architecture facts (cli_arch and runsc_arch)"
  ansible.builtin.set_fact:
    cli_arch: "{{ 'amd64' if ansible_facts['architecture'] in ['x86_64', 'amd64'] else 'arm64' }}"
    runsc_arch: "{{ 'x86_64' if ansible_facts['architecture'] in ['x86_64', 'amd64'] else 'aarch64' }}"
    host_pkg_mgr: >-
      {{
        'brew' if ansible_facts['system'] == 'Darwin'
        else ('apt' if ansible_facts['pkg_mgr'] == 'apt'
        else ('dnf' if ansible_facts['pkg_mgr'] in ['dnf', 'dnf5']
        else ('yum' if ansible_facts['pkg_mgr'] == 'yum' else 'generic')))
      }}
  tags: [always, preflight, host-prep]

- name: "[0/8] Display detected host platform, architecture, and package manager"
  ansible.builtin.debug:
    msg: "Host={{ ansible_facts['system'] }} ({{ ansible_facts['os_family'] }}) | Arch={{ ansible_facts['architecture'] }} (CLI={{ cli_arch }}, gVisor={{ runsc_arch }}) | PkgMgr={{ host_pkg_mgr }}"
  tags: [always, preflight, host-prep]

- name: "[0/8] Check if base utilities are installed (curl, tar, jq, bzip2)"
  ansible.builtin.shell: |
    for tool in curl tar jq bzip2; do
      if ! command -v "$tool" >/dev/null 2>&1; then
        echo "MISSING:$tool"
      fi
    done
  args:
    executable: /bin/bash
  register: base_utils_check
  changed_when: false
  check_mode: false
  tags: [always, preflight, host-prep]

- name: "[0/8] Install Linux base utilities via apt (Debian/Ubuntu)"
  ansible.builtin.apt:
    name: [curl, ca-certificates, tar, jq, bzip2]
    state: present
    update_cache: true
  become: "{{ ansible_facts['user_id'] != 'root' }}"
  when:
    - ansible_facts['system'] == 'Linux'
    - ansible_facts['os_family'] == 'Debian'
    - "'MISSING:' in base_utils_check.stdout"
    - not (dry_run_mode | bool)
  tags: [preflight, host-prep]

- name: "[0/8] Install Linux base utilities via dnf/yum (RHEL/Rocky/Alma/Fedora)"
  ansible.builtin.shell: |
    if command -v dnf >/dev/null 2>&1; then
      dnf install -y --allowerasing curl ca-certificates tar jq bzip2
    else
      yum install -y curl ca-certificates tar jq bzip2
    fi
  args:
    executable: /bin/bash
  become: "{{ ansible_facts['user_id'] != 'root' }}"
  changed_when: false
  when:
    - ansible_facts['system'] == 'Linux'
    - ansible_facts['os_family'] == 'RedHat'
    - "'MISSING:' in base_utils_check.stdout"
    - not (dry_run_mode | bool)
  tags: [preflight, host-prep]

- name: "[0/8] Check if sysctl configuration is already persisted"
  ansible.builtin.stat:
    path: /etc/sysctl.d/99-kubernetes-sandbox.conf
  register: sysctl_stat
  when:
    - ansible_facts['system'] == 'Linux'
    - configure_linux_sysctl | bool
  tags: [always, host-prep, sysctl]

- name: "[0/8] Persist Linux kernel sysctl parameters (/etc/sysctl.d/99-kubernetes-sandbox.conf)"
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes-sandbox.conf
    mode: "0644"
    content: |
      fs.inotify.max_user_watches={{ k8s_sysctl_params['fs.inotify.max_user_watches'] }}
      fs.inotify.max_user_instances={{ k8s_sysctl_params['fs.inotify.max_user_instances'] }}
      vm.max_map_count={{ k8s_sysctl_params['vm.max_map_count'] }}
      net.ipv4.ip_forward={{ k8s_sysctl_params['net.ipv4.ip_forward'] }}
  become: "{{ ansible_facts['user_id'] != 'root' }}"
  register: sysctl_file_result
  failed_when: false
  when:
    - ansible_facts['system'] == 'Linux'
    - configure_linux_sysctl | bool
    - not (sysctl_stat.stat.exists | default(false))
    - not (dry_run_mode | bool)
  tags: [host-prep, sysctl]

- name: "[0/8] Mask systemd wait-online services when headless_vm_optimize=true"
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: true
  loop:
    - NetworkManager-wait-online.service
    - systemd-networkd-wait-online.service
  become: "{{ ansible_facts['user_id'] != 'root' }}"
  failed_when: false
  when:
    - ansible_facts['system'] == 'Linux'
    - headless_vm_optimize | bool
    - not (dry_run_mode | bool)
  tags: [host-prep, vm-optimize]

- name: "[0/8] Audit host CLI tools (kubectl, minikube, helm, testkube, docker)"
  ansible.builtin.shell: |
    for tool in kubectl minikube helm testkube docker; do
      if command -v "$tool" >/dev/null 2>&1; then
        echo "PRESENT:$tool:$(command -v "$tool")"
      else
        echo "MISSING:$tool"
      fi
    done
  args:
    executable: /bin/bash
  register: cli_audit
  changed_when: false
  check_mode: false
  tags: [always, preflight, host-prep]

- name: "[0/8] Install missing CLI tools on macOS via Homebrew"
  ansible.builtin.shell: |
    set -e
    command -v kubectl >/dev/null 2>&1 || brew install kubectl
    command -v minikube >/dev/null 2>&1 || brew install minikube
    command -v helm >/dev/null 2>&1 || brew install helm
    command -v testkube >/dev/null 2>&1 || brew install kubeshop/testkube/testkube || brew install testkube
  args:
    executable: /bin/bash
  changed_when: true
  when:
    - ansible_facts['system'] == 'Darwin'
    - "'MISSING:kubectl' in cli_audit.stdout or 'MISSING:minikube' in cli_audit.stdout or 'MISSING:helm' in cli_audit.stdout or 'MISSING:testkube' in cli_audit.stdout"
    - not (dry_run_mode | bool)
  tags: [preflight, host-prep]

- name: "[0/8] Install multi-arch kubectl on Linux if missing"
  ansible.builtin.get_url:
    url: "https://dl.k8s.io/release/{{ k8s_fallback_version }}/bin/linux/{{ cli_arch }}/kubectl"
    dest: /usr/local/bin/kubectl
    mode: "0755"
  become: "{{ ansible_facts['user_id'] != 'root' }}"
  when:
    - ansible_facts['system'] == 'Linux'
    - "'MISSING:kubectl' in cli_audit.stdout"
    - not (dry_run_mode | bool)
  tags: [preflight, host-prep]

- name: "[0/8] Check installed Minikube version"
  ansible.builtin.shell: |
    minikube version --short 2>/dev/null || minikube version 2>/dev/null | grep -oE 'v[0-9]+\.[0-9]+' | head -n1 || echo "v0.0"
  args:
    executable: /bin/bash
  register: mk_ver_out
  changed_when: false
  check_mode: false
  tags: [always, preflight, host-prep]

- name: "[0/8] Install or upgrade multi-arch Minikube (>= v1.30) on Linux"
  ansible.builtin.get_url:
    url: "https://storage.googleapis.com/minikube/releases/latest/minikube-linux-{{ cli_arch }}"
    dest: /usr/local/bin/minikube
    mode: "0755"
    force: true
  become: "{{ ansible_facts['user_id'] != 'root' }}"
  when:
    - ansible_facts['system'] == 'Linux'
    - "'MISSING:minikube' in cli_audit.stdout or ((mk_ver_out.stdout | trim | regex_replace('^v', '')) is version('1.30', '<'))"
    - not (dry_run_mode | bool)
  tags: [preflight, host-prep]

- name: "[0/8] Install Helm v3 and Testkube CLI on Linux if missing"
  ansible.builtin.shell: |
    set -e
    command -v helm >/dev/null 2>&1 || (curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash)
    command -v testkube >/dev/null 2>&1 || (curl -sSLf https://get.testkube.io | bash)
  args:
    executable: /bin/bash
  become: "{{ ansible_facts['user_id'] != 'root' }}"
  changed_when: true
  when:
    - ansible_facts['system'] == 'Linux'
    - "'MISSING:helm' in cli_audit.stdout or 'MISSING:testkube' in cli_audit.stdout"
    - not (dry_run_mode | bool)
  tags: [preflight, host-prep]
