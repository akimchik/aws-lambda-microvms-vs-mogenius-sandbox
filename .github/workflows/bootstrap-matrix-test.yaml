name: Multi-OS & Multi-Architecture Bootstrap Matrix

on:
  push:
    branches: [ "main", "feat-*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ============================================================================
  # Native Host Matrix: macOS (Apple Silicon arm64), Ubuntu (x86_64), Ubuntu (aarch64)
  # ============================================================================
  host-matrix-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. macOS on Apple Silicon (arm64 / Homebrew flow)
          - name: "macOS (Apple Silicon M-series arm64)"
            os: macos-latest

          # 2. Linux Ubuntu (x86_64 / apt flow)
          - name: "Linux Ubuntu (x86_64 / apt)"
            os: ubuntu-latest

          # 3. Linux Ubuntu (aarch64 / apt flow)
          - name: "Linux Ubuntu (aarch64 / apt)"
            os: ubuntu-24.04-arm

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Validate Shell Script Syntax (bash -n)
        run: |
          bash -n k8s-agent-sandbox/scripts/bootstrap_cluster.sh
          bash -n k8s-agent-sandbox/ingress/test_ingress_poc.sh
          bash -n k8s-agent-sandbox/scripts/test_multios_bootstrap.sh

      - name: Run Multi-OS & Multi-Arch Bootstrap Preflight Validation
        run: |
          chmod +x k8s-agent-sandbox/scripts/bootstrap_cluster.sh
          ./k8s-agent-sandbox/scripts/bootstrap_cluster.sh --preflight-only

      - name: Run Automated Component & Manifest Deployment Test Suite
        run: |
          chmod +x k8s-agent-sandbox/scripts/test_multios_bootstrap.sh
          ./k8s-agent-sandbox/scripts/test_multios_bootstrap.sh

  # ============================================================================
  # Enterprise Linux Container: RHEL / Rocky Linux 9 (dnf package manager)
  # ============================================================================
  rhel-dnf-matrix-test:
    name: "Enterprise Linux Rocky Linux 9 (x86_64 / dnf)"
    runs-on: ubuntu-latest
    container:
      image: rockylinux:9
    steps:
      - name: Install Base Utilities (git, bash, tar, bzip2)
        run: |
          dnf install -y --allowerasing git bash tar bzip2 findutils sudo

      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Validate Shell Script Syntax (bash -n)
        run: |
          bash -n k8s-agent-sandbox/scripts/bootstrap_cluster.sh
          bash -n k8s-agent-sandbox/ingress/test_ingress_poc.sh
          bash -n k8s-agent-sandbox/scripts/test_multios_bootstrap.sh

      - name: Run Multi-OS & Multi-Arch Bootstrap Preflight Validation on RHEL (dnf)
        run: |
          chmod +x k8s-agent-sandbox/scripts/bootstrap_cluster.sh
          ./k8s-agent-sandbox/scripts/bootstrap_cluster.sh --preflight-only

      - name: Run Automated Component & Manifest Deployment Test Suite on RHEL
        run: |
          chmod +x k8s-agent-sandbox/scripts/test_multios_bootstrap.sh
          ./k8s-agent-sandbox/scripts/test_multios_bootstrap.sh
