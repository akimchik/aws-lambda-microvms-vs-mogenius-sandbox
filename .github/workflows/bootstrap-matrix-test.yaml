name: Multi-OS & Multi-Architecture Bootstrap Matrix

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'LICENSE'
      - '.gitignore'

jobs:
  # ============================================================================
  # Native Host Matrix: macOS (Apple Silicon arm64), Ubuntu (x86_64), Ubuntu (aarch64)
  # ============================================================================
  host-matrix-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1. macOS on Apple Silicon (arm64 / Homebrew flow)
          - name: "macOS (Apple Silicon M-series arm64)"
            os: macos-latest

          # 2. Linux Ubuntu (x86_64 / apt flow)
          - name: "Linux Ubuntu (x86_64 / apt)"
            os: ubuntu-latest

          # 3. Linux Ubuntu (aarch64 / apt flow)
          - name: "Linux Ubuntu (aarch64 / apt)"
            os: ubuntu-24.04-arm

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install Test Utilities (Ruby / PyYAML / Ansible)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ruby python3-yaml ansible-core || sudo apt-get install -y -qq ansible

      - name: Validate Shell Script Syntax (bash -n)
        run: |
          bash -n k8s-agent-sandbox/scripts/bootstrap_cluster.sh
          bash -n k8s-agent-sandbox/ingress/test_ingress_poc.sh
          bash -n k8s-agent-sandbox/scripts/test_multios_bootstrap.sh

      - name: Verify CLI Help & Fail-Fast Argument Parsing
        run: |
          chmod +x k8s-agent-sandbox/scripts/bootstrap_cluster.sh
          ./k8s-agent-sandbox/scripts/bootstrap_cluster.sh --help
          # Assert fail-fast on invalid flags
          if ./k8s-agent-sandbox/scripts/bootstrap_cluster.sh --bogus-flag 2>/dev/null; then exit 1; fi
          if ./k8s-agent-sandbox/scripts/bootstrap_cluster.sh --memory 2>/dev/null; then exit 1; fi
          if ./k8s-agent-sandbox/scripts/bootstrap_cluster.sh --memory abc 2>/dev/null; then exit 1; fi

      - name: Run Read-Only Dry-Run Audit (--dry-run)
        run: |
          ./k8s-agent-sandbox/scripts/bootstrap_cluster.sh --dry-run

      - name: Run Multi-OS & Multi-Arch Bootstrap Preflight Validation
        run: |
          ./k8s-agent-sandbox/scripts/bootstrap_cluster.sh --preflight-only

      - name: Run Automated Component & Manifest Deployment Test Suite
        run: |
          chmod +x k8s-agent-sandbox/scripts/test_multios_bootstrap.sh
          ./k8s-agent-sandbox/scripts/test_multios_bootstrap.sh

  # ============================================================================
  # Enterprise Linux Container: RHEL / Rocky Linux 9 (dnf package manager - x86_64 & aarch64)
  # ============================================================================
  rhel-dnf-matrix-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Enterprise Linux Rocky Linux 9 (x86_64 / dnf)"
            os: ubuntu-latest
          - name: "Enterprise Linux Rocky Linux 9 (aarch64 / dnf)"
            os: ubuntu-24.04-arm
    container:
      image: rockylinux:9
    steps:
      - name: Install Base Utilities (git, bash, tar, bzip2, ruby/python, ansible)
        run: |
          dnf install -y --allowerasing make git bash tar bzip2 findutils sudo ruby python3-pyyaml ansible-core || dnf install -y --allowerasing make git bash tar bzip2 findutils sudo ruby python3-pyyaml

      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Validate Shell Script Syntax (bash -n)
        run: |
          bash -n k8s-agent-sandbox/scripts/bootstrap_cluster.sh
          bash -n k8s-agent-sandbox/ingress/test_ingress_poc.sh
          bash -n k8s-agent-sandbox/scripts/test_multios_bootstrap.sh

      - name: Verify CLI Help & Fail-Fast Argument Parsing
        run: |
          chmod +x k8s-agent-sandbox/scripts/bootstrap_cluster.sh
          ./k8s-agent-sandbox/scripts/bootstrap_cluster.sh --help
          if ./k8s-agent-sandbox/scripts/bootstrap_cluster.sh --bogus-flag 2>/dev/null; then exit 1; fi
          if ./k8s-agent-sandbox/scripts/bootstrap_cluster.sh --memory 2>/dev/null; then exit 1; fi
          if ./k8s-agent-sandbox/scripts/bootstrap_cluster.sh --memory abc 2>/dev/null; then exit 1; fi

      - name: Run Read-Only Dry-Run Audit on RHEL (--dry-run)
        run: |
          ./k8s-agent-sandbox/scripts/bootstrap_cluster.sh --dry-run

      - name: Run Multi-OS & Multi-Arch Bootstrap Preflight Validation on RHEL (dnf)
        run: |
          ./k8s-agent-sandbox/scripts/bootstrap_cluster.sh --preflight-only

      - name: Run Automated Component & Manifest Deployment Test Suite on RHEL
        run: |
          chmod +x k8s-agent-sandbox/scripts/test_multios_bootstrap.sh
          ./k8s-agent-sandbox/scripts/test_multios_bootstrap.sh

  # ============================================================================
  # Debian Linux Container: Debian 12 Bookworm (apt + non-root sudo tty_tickets)
  # ============================================================================
  debian-apt-matrix-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Debian 12 Bookworm (x86_64 / apt & non-root sudo)"
            os: ubuntu-latest
          - name: "Debian 12 Bookworm (aarch64 / apt & non-root sudo)"
            os: ubuntu-24.04-arm
    container:
      image: debian:bookworm
    steps:
      - name: Install Base Utilities & Configure Non-Root Sudo User (tty_tickets)
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq make git bash tar bzip2 findutils sudo ruby python3-yaml python3-jinja2 ansible-core procps curl ca-certificates jq openssl
          useradd -m -s /bin/bash debianuser
          echo "debianuser:debianpass" | chpasswd
          echo "Defaults tty_tickets" > /etc/sudoers.d/debianuser
          echo "debianuser ALL=(ALL:ALL) ALL" >> /etc/sudoers.d/debianuser
          chmod 0440 /etc/sudoers.d/debianuser

      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Verify Non-Root Debian Sudo Mode Detection & Dry-Run Audit (tty_tickets active)
        run: |
          chown -R debianuser:debianuser .
          su - debianuser -c "cd '$PWD' && ./k8s-agent-sandbox/scripts/bootstrap_cluster.sh --dry-run"
          su - debianuser -c "cd '$PWD' && bash -c '
            source ./k8s-agent-sandbox/scripts/bootstrap_cluster.sh
            detect_platform
            detect_sudo_mode
            [ \"\$SUDO_NEEDS_PASS\" = true ] || { echo \"FAIL: SUDO_NEEDS_PASS not detected on Debian non-root\"; exit 1; }
            CONFIGURE_HOST_SYSCTL=true
            build_ansible_args
            printf \"%s\n\" \"\${ANSIBLE_ARGS[@]}\" | grep -qx -- \"--ask-become-pass\" || { echo \"FAIL: --ask-become-pass missing on Debian tty_tickets\"; exit 1; }
            echo \"PASS: Debian non-root tty_tickets sudo mode & --ask-become-pass verified!\"
          '"

      - name: Run Multi-OS & Multi-Arch Bootstrap Preflight & Unit Test Suite on Debian 12
        run: |
          chmod +x k8s-agent-sandbox/scripts/bootstrap_cluster.sh k8s-agent-sandbox/scripts/test_multios_bootstrap.sh
          ./k8s-agent-sandbox/scripts/bootstrap_cluster.sh --preflight-only
          su - debianuser -c "cd '$PWD' && ./k8s-agent-sandbox/scripts/test_multios_bootstrap.sh"
